  build:
    # needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get build info
        id: build-info
        run: |
          echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend/Dockerfile
          platforms: linux/amd64
          provenance: false
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hawk-eye-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/hawk-eye-frontend:${{ steps.build-info.outputs.version }}
          build-args: |
            VERSION=${{ steps.build-info.outputs.version }}
            BUILD_TIME=${{ steps.build-info.outputs.build_time }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: Backend
          file: docker/backend/Dockerfile
          platforms: linux/amd64
          provenance: false
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hawk-eye-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/hawk-eye-api:${{ steps.build-info.outputs.version }}
          build-args: |
            VERSION=${{ steps.build-info.outputs.version }}
            BUILD_TIME=${{ steps.build-info.outputs.build_time }}
      
  deploy:
    needs: build
    runs-on:
      ubuntu-latest
    steps:
      - name: setting up the ssh key
        run: | 
          mkdir -p ~/.ssh
          echo "${{secrets.SSH_PRIVATE_KEY}}" > ~/.ssh/deploy_key.pem
          chmod 600 ~/.ssh/deploy_key.pem
          ssh-keyscan -H ${{secrets.HOST}} >> ~/.ssh/known_hosts

      - name: Rsyncing Compose file
        run: |
          rsync -avz -e "ssh -i ~/.ssh/deploy_key.pem" \ 
            docker-compose.yml
            ubuntu@${{secrets.HOST}}:/opt/Hawk-eye/
      
      - name: deploying the Application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{secrets.HOST}}
          username: ${{secrets.USERNAME}}
          key: ${{secrets.SSH_PRIVATE_KEY}}
          script: |
            cd /opt/Hawk-eye
            docker compose --env-file .env -f docker-compose.yml pull
            docker compose --env-file .env -f docker-compose.yml down && docker compose --env-file .env -f docker-compose.yml up -d
            echo "The Application has been successfully deployed"
          

